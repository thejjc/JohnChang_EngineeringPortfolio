<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

<div class="grid-bg" aria-hidden="true"></div>

<header class="site-header">
  <nav class="wrap">
    <a class="nav-mark" href="{{ '/' | relative_url }}">JOHN CHANG <span>/ ENGINEERING</span></a>
    <a class="nav-back" href="{{ '/' | relative_url }}">Index</a>
  </nav>
</header>

{% if page.hero %}
<section class="hero">
  <video class="hero-video" autoplay muted loop playsinline
    poster="{{ '/assets/video/hero-poster.jpg' | relative_url }}">
    <source src="{{ '/assets/video/hero-placeholder.mp4' | relative_url }}" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>
  <div class="hero-inner wrap">
    <p class="hero-eyebrow mono">AEROSPACE &amp; MECHANICAL ENGINEERING</p>
    <h1 class="hero-title">John Chang</h1>
    <p class="hero-sub">Propulsion, dynamics, and structures — designed, simulated, and validated.</p>
  </div>
</section>
{% endif %}

<main class="wrap content" id="content">
{{ content }}
</main>

<footer class="site-footer">
  <div class="wrap footer-row">
    <span class="mono footer-legend">HOSTED ON GITHUB PAGES · BUILT WITH JEKYLL</span>
    <div class="footer-links">
      <a href="https://github.com/thejjc" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/-john-chang/" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:chang974@purdue.edu">Email</a>
    </div>
  </div>
</footer>

<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
